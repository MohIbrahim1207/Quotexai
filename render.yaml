services:
  - type: web
    name: quotation-converter-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: FRONTEND_URL
        value: "https://quotex-ai.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.2"
